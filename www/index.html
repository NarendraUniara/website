<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
apiKey: "AIzaSyBwwiQUveVoSV9TlHhw7_9ALnvZFigsDCg",
authDomain: "webapp-9504b.firebaseapp.com",
projectId: "webapp-9504b",
storageBucket: "webapp-9504b.firebasestorage.app",
messagingSenderId: "103585059938",
appId: "1:103585059938:web:89d370e94fde38efb8ed3b",
measurementId: "G-C6C3XRC992"
};
const fbApp = initializeApp(firebaseConfig);
const fbAuth = getAuth(fbApp);
const fbDb = getFirestore(fbApp);
const googleProvider = new GoogleAuthProvider();
googleProvider.addScope('https://www.googleapis.com/auth/drive.appdata');
googleProvider.setCustomParameters({ prompt: 'select_account' });
const googleProviderFirstConsent = new GoogleAuthProvider();
googleProviderFirstConsent.addScope('https://www.googleapis.com/auth/drive.appdata');
googleProviderFirstConsent.setCustomParameters({ prompt: 'consent' });

const isNativeApp = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());

async function nativeSignIn() {
const { FirebaseAuthentication } = await import('@capacitor-firebase/authentication');
const result = await FirebaseAuthentication.signInWithGoogle();
return { user: result.user, accessToken: result.credential ? result.credential.accessToken : null };
}
async function nativeSignOut() {
const { FirebaseAuthentication } = await import('@capacitor-firebase/authentication');
await FirebaseAuthentication.signOut();
}

window.FB = {
auth: fbAuth,
db: fbDb,
signIn: () => isNativeApp ? nativeSignIn() : signInWithPopup(fbAuth, googleProviderFirstConsent).then((result) => {
const credential = GoogleAuthProvider.credentialFromResult(result);
return { user: result.user, accessToken: credential ? credential.accessToken : null };
}),
signInDriveOnly: () => isNativeApp ? nativeSignIn() : signInWithPopup(fbAuth, googleProvider).then((result) => {
const credential = GoogleAuthProvider.credentialFromResult(result);
return { user: result.user, accessToken: credential ? credential.accessToken : null };
}),
signOutUser: () => isNativeApp ? nativeSignOut() : signOut(fbAuth),
doc, setDoc, deleteDoc, getDoc
};

if (isNativeApp) {
import('@capacitor-firebase/authentication').then(({ FirebaseAuthentication }) => {
FirebaseAuthentication.addListener('authStateChange', (change) => {
if (window.onFirebaseAuthChange) window.onFirebaseAuthChange(change.user || null);
});
});
} else {
onAuthStateChanged(fbAuth, (user) => {
if (window.onFirebaseAuthChange) window.onFirebaseAuthChange(user);
});
}
</script>

async function driveErrorMessage(res) {
let body = null;
try { body = await res.json(); } catch (e) {}
const msg = body && body.error && body.error.message ? body.error.message : '';
const status = body && body.error && body.error.status ? body.error.status : '';
let friendly = 'Drive error (' + res.status + ')';
if (res.status === 401) friendly = 'Drive session expire ho gayi';
else if (res.status === 403 && /disabled|has not been used|it is disabled/i.test(msg)) friendly =
'Google Drive API GCP console me disabled hai';
else if (res.status === 403 && /insufficient|scope/i.test(msg)) friendly = 'Drive permission (scope) nahi mili';
else if (res.status === 403) friendly = 'Drive access forbidden';
return friendly + ' — Raw: [' + res.status + '] ' + (msg || status || 'no details');
}

async function findDriveBackupFile() {

});

'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
const res = await fetch(url, {
method: existing ? 'PATCH' : 'POST',
headers: { Authorization: 'Bearer ' + driveAccessToken, 'Content-Type': 'multipart/related; boundary=' +
boundary },
body: body
});
if (!res.ok) { const em = await driveErrorMessage(res);
if (res.status === 401 || res.status === 403) { driveAccessToken = null; clearDriveTokenFromStorage(); }
throw new Error(em); }
state.settings.driveLastBackup = Date.now();

function compressImage(file, callback) {
if (!file) { callback(null); return; }

const img = new Image();
img.onload = function() {
let w = img.width,
h = img.height;
const maxDim = 360;
if (w > maxDim || h > maxDim) { if (w >= h) { h = Math.round(h * maxDim / w);
w = maxDim; } else { w = Math.round(w * maxDim / h);
h = maxDim; } }
function renderAt(width, height) {

canvas.width = width;
canvas.height = height;
const ctx = canvas.getContext('2d');
ctx.drawImage(img, 0, 0, width, height);
let quality = 0.8;
let dataUrl = canvas.toDataURL('image/webp', quality);
while (dataUrl.length > MAX_DATAURL_LEN && quality > 0.3) { quality -= 0.1;
dataUrl = canvas.toDataURL('image/webp', quality); }
return dataUrl;
}
let dataUrl = renderAt(w, h);
let tries = 0;
while (dataUrl.length > MAX_DATAURL_LEN && tries < 5) { w = Math.round(w * 0.8);
h = Math.round(h * 0.8);

'<div class="ts-track ' + (formTemp.payMode === 'online' ? 'online' : '') +
'" onclick="togglePayMode()"><div class="ts-knob">' + (formTemp.payMode === 'online' ? 'Online' :
'Cash') + '</div></div></div>'; }
function setTxType(t) { formTemp.txType = t;
document.getElementById('txTypeWrap').innerHTML = txTypeHtml();
document.getElementById('payModeWrap').innerHTML = payModeHtml(); }
function togglePayMode() { formTemp.payMode = formTemp.payMode === 'cash' ? 'online' : 'cash';
document.getElementById('payModeWrap').innerHTML = payModeHtml(); }
function saveNewTx(aid) { const amt = parseFloat(document.getElementById('txAmt').value) || 0; if (amt <= 0) { toast(
'Amount daalein'); return; } const acc = state.accounts.find(a => a.id === aid);
const note = document.getElementById('txNote').value.trim();
if (formTemp.editTxId) {
const tx = acc.transactions.find(x => x.id === formTemp.editTxId);
if (tx) { tx.txType = formTemp.txType; tx.billStatus = formTemp.txType === 'bill' ? (tx.billStatus || 'unpaid') : null;
tx.payMode = formTemp.txType === 'payment' ? (formTemp.payMode || 'cash') : null;
tx.amount = amt; tx.note = note; tx.category = formTemp.txCategory || null; }
} else {
acc.transactions.push({ id: uid(), txType: formTemp.txType, billStatus: formTemp.txType === 'bill' ?
'unpaid' : null, payMode: formTemp.txType === 'payment' ? (formTemp.payMode || 'cash') : null,
amount: amt, date: todayISO(), time: nowTime(), note: note,
category: formTemp.txCategory || null, createdAt: Date.now() });
}
scheduleSave();
closeModal();
render();
toast('Khata update ho gaya'); }
function confirmDeleteTx(aid, tid) { openConfirmModal('Entry Delete?', 'Ye transaction delete ho jayegi.',
function() { const acc = state.accounts.find(a => a.id === aid);
acc.transactions = acc.transactions.filter(t => t.id !== tid);
scheduleSave();
closeModal();
render(); }); }
document.addEventListener('focusin', function(e) { if (e.target && (e.target.tagName === 'INPUT' || e.target
.tagName === 'TEXTAREA')) { setTimeout(() => { try { e.target.scrollIntoView({ block: 'center',
behavior: 'smooth' }); } catch (err) {} }, 300); } });
function handleSignOut() {
sharedViewData = null;
if (window.FB) window.FB.signOutUser().catch(() => {});
render();
toast('Sign out ho gaya');
}
window.onFirebaseAuthChange = function(user) {
currentUser = user;
if (!user) {
sharedViewData = null;
render();
return;
}
const email = (user.email || '').trim().toLowerCase();
sharedViewData = loadSharedCacheFresh(email);
render();
checkSharedUpdate(email, true);
};
document.addEventListener('visibilitychange', function() {
if (document.visibilityState === 'visible' && currentUser && sharedViewData) {
const email = (currentUser.email || '').trim().toLowerCase();
if (!loadSharedCacheFresh(email)) { sharedViewData = null;
render();
checkSharedUpdate(email, true); }
}
});
loadState();
</script>
</body>
</html>
