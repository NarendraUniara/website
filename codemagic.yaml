workflows:
  android-workflow:
    name: Embroidery Ledger Pro - Android Build
    max_build_duration: 30
    environment:
      node: 20
      vars:
        PACKAGE_NAME: "com.embroidery.ledgerpro"
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Add Android platform
        script: |
          npx cap add android
      - name: Copy google-services.json
        script: |
          cp google-services.json android/app/google-services.json
      - name: Sync Capacitor
        script: |
          npx cap sync android
      - name: Apply Google Services Gradle plugin
        script: |
          # Add classpath to project-level build.gradle if not already present
          if ! grep -q "com.google.gms:google-services" android/build.gradle; then
            sed -i "s#dependencies {#dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'#" android/build.gradle
          fi
          # Apply plugin at the bottom of app-level build.gradle if not already present
          if ! grep -q "apply plugin: 'com.google.gms.google-services'" android/app/build.gradle; then
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          fi
      - name: Build debug APK
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
